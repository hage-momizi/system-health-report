name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb
        run: cargo deb

      - name: Find .deb file
        id: find_deb
        run: |
          DEB=$(ls target/debian/*.deb | head -1)
          echo "path=$DEB" >> $GITHUB_OUTPUT
          echo "name=$(basename $DEB)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ steps.find_deb.outputs.path }}
          body: |
            ## ${{ github.ref_name }}

            ### Installation

            ```bash
            sudo dpkg -i ${{ steps.find_deb.outputs.name }}
            sudo nano /etc/system-health-report/config.yml
            sudo systemctl enable --now system-health-report
            ```
